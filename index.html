<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1318" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="İletişim Panosu" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />

    <title>İletişim Panosu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="AAC ses panosu">
      <header class="sr-only">
        <h1>İletişim Panosu</h1>
      </header>

      <section class="toolbar" aria-label="Kontroller">
        <button id="record-mode-toggle" class="tool-btn" type="button" aria-pressed="false">
          Kayıt Modu: Kapalı
        </button>
        <p id="status-text" class="status-text" aria-live="polite"></p>
      </section>

      <section id="button-grid" class="button-grid" aria-live="polite"></section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
